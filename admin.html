<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#ffffff">
<title>DRR Admin</title>
<style>
:root{--red:#B52A1C;--bg:#ffffff;--card:#ffffff;--ink:#161616;--mute:#6f6f6f;--line:#eeeeee;--ok:#2f855a;--r:3px;--r-s:8px;
--sh:0 2px 12px rgba(0,0,0,.08),0 1px 3px rgba(0,0,0,.06);--navbg:#f0f0f2;--sh-top:0 3px 12px rgba(0,0,0,.12);--sh-bot:0 -3px 12px rgba(0,0,0,.12);color-scheme:light only}
*{box-sizing:border-box;margin:0}
html,body{background:#fff}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans Telugu",system-ui,-apple-system,Roboto,sans-serif;font-size:14px;overflow-y:auto}
button,input{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--red);outline-offset:2px}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:#fff;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:0;z-index:10;background:var(--navbg);color:var(--ink);height:calc(56px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 16px 0;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--sh-top)}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px;color:var(--ink)}
.logo b{background:var(--red);color:#fff;padding:3px 8px;border-radius:3px;font-size:12px}
.pill{background:var(--red);color:#fff;padding:4px 10px;border-radius:3px;font-size:11px;font-weight:700}
.back{display:flex;align-items:center;gap:6px;color:var(--ink);font-weight:700;padding:6px 4px}
main{padding:16px 14px}
h3{font-size:15px;margin:22px 0 10px;display:flex;justify-content:space-between;align-items:center}
h3 small{color:var(--mute);font-weight:400;font-size:12px}
.card{background:var(--card);border:1px solid rgba(0,0,0,.04);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{padding:14px}
.stat small{color:var(--mute);font-size:12px}
.stat b{display:block;font-size:26px;margin-top:2px}
.stat i{font-style:normal;font-size:11px;color:var(--ok);font-weight:700}
.stat i.dn{color:var(--red)}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;padding:16px 14px 10px}
.bars div{flex:1;text-align:center;font-size:10px;color:var(--mute);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bars span{display:block;background:var(--red);border-radius:3px;margin-bottom:4px}
.list{display:grid;gap:10px}
.row{display:flex;gap:12px;align-items:center;padding:10px 12px;width:100%;text-align:left;background:#fff;border:1px solid rgba(0,0,0,.05);border-radius:var(--r);box-shadow:var(--sh)}
button.row:active{background:#f7f7f7}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none}
.th{position:relative;width:64px;height:64px;border-radius:3px;flex:none;display:grid;place-items:center;color:#fff;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.2);background-image:radial-gradient(circle at 82% 18%,rgba(255,255,255,.4) 0,transparent 42%),radial-gradient(circle at 15% 95%,rgba(0,0,0,.3) 0,transparent 55%)}
.th svg{filter:drop-shadow(0 1px 3px rgba(0,0,0,.35))}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.th .pl{position:absolute;z-index:2;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center}
.th .pl svg{filter:none;margin-left:1px}
.th.noimg .pl{display:none}
.th.grey{filter:grayscale(1)}
.th.big{width:100%;height:118px;box-shadow:none;border-radius:0}
.th.big .pl{width:36px;height:36px}
.th.big .pl svg{width:16px;height:16px}
.th em{z-index:3}
.strip{display:flex;gap:12px;overflow-x:auto;margin:0 -14px;padding:4px 14px 14px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.strip::-webkit-scrollbar{display:none}
.pv{flex:none;width:200px;scroll-snap-align:start;background:#fff;border:1px solid rgba(0,0,0,.05);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.pv .bd{padding:10px 11px 12px}
.pv .t{font-size:13px}
.dayb{display:flex;align-items:flex-end;gap:6px;padding:14px 10px 10px}
.dayb button{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:150px;font-size:10px;color:var(--mute);border-radius:3px;padding:6px 2px 4px;gap:4px}
.dayb button.on{background:#f3f3f5;color:var(--ink);font-weight:700;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.dayb .n{font-weight:700;font-size:11px;color:var(--ink)}
.dayb .stk{width:70%;max-width:26px;display:flex;flex-direction:column;justify-content:flex-end;flex:1;gap:2px}
.dayb .stk span{display:block;border-radius:3px;min-height:0}
.dayb .a{background:var(--red)}
.dayb .rl{background:#222}
.legend{display:flex;gap:14px;padding:0 14px 12px;font-size:11px;color:var(--mute)}
.legend b{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.th em{position:absolute;right:3px;bottom:3px;background:rgba(0,0,0,.55);color:#fff;font-style:normal;font-size:8px;font-weight:700;padding:1px 4px;border-radius:3px}
.grow{flex:1;min-width:0}
.t{font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.m{color:var(--mute);font-size:12px;margin-top:3px}
.tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:3px;background:#f0f0f0;color:var(--mute);margin-right:5px}
.tag.r{background:var(--red);color:#fff}
.tag.g{background:var(--ok);color:#fff}
.rk{width:24px;font-weight:800;color:var(--red);font-size:16px;text-align:center;flex:none}
.likes{font-weight:700;font-size:13px;white-space:nowrap}
.more{display:block;width:100%;margin-top:12px;padding:12px;border:1px solid var(--red);color:var(--red);font-weight:700;border-radius:var(--r);background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.12)}
.search{width:100%;padding:13px 14px;border:1px solid rgba(0,0,0,.06);background:#fff;border-radius:var(--r);box-shadow:var(--sh);cursor:text}
.seg{display:flex;gap:8px;margin-bottom:12px}
.seg button{flex:1;padding:10px;border:1px solid rgba(0,0,0,.06);background:#fff;border-radius:var(--r);font-weight:700;color:var(--mute);box-shadow:var(--sh)}
.seg button.on{background:var(--red);border-color:var(--red);color:#fff}
.prof{display:flex;gap:14px;align-items:center;padding:16px}
.prof .av{width:58px;height:58px;font-size:20px}
.empty{padding:24px;text-align:center;color:var(--mute)}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-radius:22px 22px 0 0;display:flex;padding:0 6px calc(10px + env(safe-area-inset-bottom,0px));z-index:20;box-shadow:0 -4px 18px rgba(0,0,0,.12)}
nav button{flex:1;position:relative;color:#6b6b6b;display:grid;justify-items:center;gap:3px;font-size:11px;padding:12px 0 2px}
nav button span{display:grid;place-items:center;height:24px}
nav button.on{color:var(--red);font-weight:700}
nav button.on::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:34px;height:3px;border-radius:0 0 3px 3px;background:var(--red)}
</style>
</head>
<body>
<div id="app">
<div class="top" id="top"></div>
<main id="main"></main>
<nav id="nav"></nav>
</div>
<script>
const $=id=>document.getElementById(id);
const COL=["#B52A1C","#2b6cb0","#2f855a","#6b46c1","#c05621","#0f766e"];
const U=[["Venkat R","Medchal"],["Sana Fathima","Hyderabad"],["Ravi Teja","Warangal"],["Anita Sharma","Delhi"],["Kiran Kumar","Chintalakunta"],["Lakshmi P","Vijayawada"],["Suresh Babu","Guntur"],["Meena K","Nizamabad"]]
.map((u,i)=>({id:i,name:u[0],loc:u[1],col:COL[i%6],joined:"Jan "+(i+3)+", 2026"}));
const TT=["Heavy rain alert for Hyderabad","New metro line opens next month","Local MLA inaugurates road project","Star hero announces new film","Job fair: 500 vacancies in town","Cricket final tonight: match preview","Petrol price update today","Farmers get new subsidy scheme","College results released","Temple festival draws huge crowd","Water supply disrupted in 5 areas","Viral: street singer wins hearts"];
const P=[];
for(let i=0;i<42;i++){const u=U[(i*3)%8];P.push({id:i,uid:u.id,type:i%3===1?"Reel":"Article",title:TT[i%12]+(i>11?" #"+(i+1):""),likes:Math.round(((i*7919)%900)+40+(i%5)*210),views:Math.round(((i*6113)%9000)+800),hrs:Math.round(i*3.9)+1})}
const D=[];
const WHO=[["Admin","Admin"],["Moderator","Mod"],["Author","Self"]];
const RS=["Fake news report","Duplicate post","Author removed","Copyright claim","Policy violation"];
for(let i=0;i<14;i++){const p=P[(i*2+5)%42],w=WHO[i%3];D.push({pid:p.id,title:p.title,type:p.type,by:w[0]==="Author"?U[p.uid].name:w[0]===" Admin"?"Admin":w[0]==="Moderator"?"Mod Ravi":"Admin",role:w[0],reason:RS[i%5],hrs:i*5+2,author:U[p.uid].name})}
const ago=h=>h<24?h+"h ago":Math.floor(h/24)+"d ago";
const fmt=n=>n>=1000?(n/1000).toFixed(1)+"K":n;
const st={tab:"dash",user:null,ut:"All",tr:"Article",q:"",day:0,af:"All",n:{dash:5,user:5,tr:5,del:5,act:5}};
let IMG=[];
const IC={"dash": "<svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 4h6v7H4zM14 4h6v4h-6zM14 12h6v8h-6zM4 15h6v5H4z\"/></svg>", "users": "<svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"9\" cy=\"8\" r=\"3.2\"/><path d=\"M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6M16 5a3 3 0 010 6M18 14c2 .7 3 2.5 3 6\"/></svg>", "trend": "<svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 17l6-6 4 4 8-8M15 7h6v6\"/></svg>", "act": "<svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4\" y=\"5\" width=\"16\" height=\"15\" rx=\"2\"/><path d=\"M4 10h16M8 3v4M16 3v4M8 14h3\"/></svg>", "del": "<svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3\"/></svg>"};
const NAV=[["dash",IC.dash,"Dashboard"],["act",IC.act,"Activity"],["users",IC.users,"Users"],["trend",IC.trend,"Trending"],["del",IC.del,"Deleted"]];
const PLAY=`<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5l11 7-11 7z"/></svg>`,DOC=`<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6zM9 12h7M9 16h7M9 8h3"/></svg>`;
function nav(){$("nav").innerHTML=NAV.map(n=>`<button class="${st.tab===n[0]?"on":""}" data-t="${n[0]}"><span>${n[1]}</span>${n[2]}</button>`).join("");
$("nav").querySelectorAll("button").forEach(b=>b.onclick=()=>{st.tab=b.dataset.t;st.user=null;st.q="";render();scrollTo(0,0)})}
function hdr(){$("top").innerHTML=st.user!==null?`<button class="back" id="bk">← Users</button><span class="pill">USER</span>`:`<div class="logo"><b>DRR</b> Admin</div><span class="pill">ADMIN</span>`;
if(st.user!==null)$("bk").onclick=()=>{st.user=null;render()}}
const more=(k,len)=>st.n[k]<len?`<button class="more" data-k="${k}">Show more (${len-st.n[k]})</button>`:"";
const PLAYS=`<svg viewBox="0 0 24 24" width="12" height="12" fill="#fff"><path d="M8 5l11 7-11 7z"/></svg>`;
function media(p,big,grey){const im=IMG.length?IMG[p.id%IMG.length]:"";
return `<div class="th${big?" big":""}${grey?" grey":""}" style="background-color:${COL[p.id%6]}">${p.type==="Reel"?PLAY:DOC}${im?`<img src="${im}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.classList.add('noimg');this.remove()">`:""}${p.type==="Reel"&&im?`<span class="pl">${PLAYS}</span>`:""}<em>${p.type==="Reel"?"REEL":"NEWS"}</em></div>`}
const postRow=(p,rank)=>`<div class="row">${rank?`<div class="rk">${rank}</div>`:""}${media(p)}<div class="grow"><div class="t">${p.title}</div><div class="m"><span class="tag ${p.type==="Reel"?"r":""}">${p.type}</span>${U[p.uid].name} · ${ago(p.hrs)}</div></div><div class="likes">♥ ${fmt(p.likes)}</div></div>`;
const dayOf=p=>Math.floor(p.hrs/24);
const dt=d=>new Date(Date.now()-d*864e5);
const dShort=d=>d===0?"Today":dt(d).toLocaleDateString("en-IN",{weekday:"short"});
const dLong=d=>d===0?"Today":d===1?"Yesterday":dt(d).toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short"});
function dayStats(d){const a=P.filter(p=>dayOf(p)===d).sort((x,y)=>x.hrs-y.hrs);return{d,a,art:a.filter(p=>p.type==="Article").length,reel:a.filter(p=>p.type==="Reel").length,likes:a.reduce((s,p)=>s+p.likes,0),views:a.reduce((s,p)=>s+p.views,0)}}
const cmp=(n,m)=>{const d=n-m;return `<i class="${d<0?"dn":""}">${d>=0?"▲":"▼"} ${Math.abs(d)} vs yesterday</i>`};
function dash(){
const latest=[...P].sort((a,b)=>a.hrs-b.hrs);
const S7=[6,5,4,3,2,1,0].map(dayStats),days=S7.map(x=>dShort(x.d)),v=S7.map(x=>x.a.length),mx=Math.max(...v,1);
return `<div class="grid">
<div class="card stat"><small>Total users</small><b>${U.length*312}</b><i>▲ 4.2% this week</i></div>
<div class="card stat"><small>Articles</small><b>${P.filter(p=>p.type==="Article").length*41}</b><i>▲ 2.1%</i></div>
<div class="card stat"><small>Reels</small><b>${P.filter(p=>p.type==="Reel").length*37}</b><i>▲ 8.6%</i></div>
<div class="card stat"><small>Deleted</small><b>${D.length}</b><i class="dn">▼ needs review</i></div></div>
<h3>Posts this week <small>last 7 days</small></h3>
<div class="card bars">${v.map((x,i)=>`<div><b style="font-size:11px;color:#161616;margin-bottom:3px">${x}</b><span style="height:${x/mx*100}%"></span>${days[i]}</div>`).join("")}</div>
<h3>Latest posted <small>newest first</small></h3>
<div class="list">${latest.slice(0,st.n.dash).map(p=>postRow(p)).join("")}</div>${more("dash",latest.length)}`}
function act(){
const S=[0,1,2,3,4,5,6].map(dayStats),T=S[0],Y=S[1],W=[...S].reverse();
const tot=S.reduce((s,x)=>s+x.a.length,0),art=S.reduce((s,x)=>s+x.art,0),reel=S.reduce((s,x)=>s+x.reel,0),lk=S.reduce((s,x)=>s+x.likes,0),vw=S.reduce((s,x)=>s+x.views,0);
const mx=Math.max(...S.map(x=>x.a.length),1);
const cur=S[st.day],list=st.af==="All"?cur.a:cur.a.filter(p=>p.type===st.af);
return `<h3 style="margin-top:0">Posted today <small>${dt(0).toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"short"})}</small></h3>
<div class="grid">
<div class="card stat"><small>Total posted</small><b>${T.a.length}</b>${cmp(T.a.length,Y.a.length)}</div>
<div class="card stat"><small>Likes today</small><b>${fmt(T.likes)}</b><i>♥ on new posts</i></div>
<div class="card stat"><small>Articles</small><b>${T.art}</b><i>${Y.art} yesterday</i></div>
<div class="card stat"><small>Reels</small><b>${T.reel}</b><i>${Y.reel} yesterday</i></div></div>
<h3>New today <small>${T.a.length} posts</small></h3>
${T.a.length?`<div class="strip">${T.a.map(p=>`<div class="pv">${media(p,true)}<div class="bd"><div class="t">${p.title}</div><div class="m"><span class="tag ${p.type==="Reel"?"r":""}">${p.type}</span>${ago(p.hrs)}</div><div class="m">${U[p.uid].name} · ♥ ${fmt(p.likes)}</div></div></div>`).join("")}</div>`:'<div class="card"><div class="empty">Nothing posted today yet</div></div>'}
<h3>Last 7 days <small>tap a day</small></h3>
<div class="card"><div class="dayb">${W.map(x=>`<button data-d="${x.d}" class="${st.day===x.d?"on":""}"><span class="n">${x.a.length}</span><div class="stk"><span class="rl" style="height:${x.reel/mx*100}%"></span><span class="a" style="height:${x.art/mx*100}%"></span></div>${dShort(x.d)}</button>`).join("")}</div>
<div class="legend"><span><b style="background:var(--red)"></b>Articles</span><span><b style="background:#222"></b>Reels</span></div></div>
<div class="grid" style="margin-top:12px">
<div class="card stat"><small>Posted (7 days)</small><b>${tot}</b><i>${art} articles · ${reel} reels</i></div>
<div class="card stat"><small>Daily average</small><b>${(tot/7).toFixed(1)}</b><i>posts per day</i></div>
<div class="card stat"><small>Total likes</small><b>${fmt(lk)}</b><i>last 7 days</i></div>
<div class="card stat"><small>Total views</small><b>${fmt(vw)}</b><i>last 7 days</i></div></div>
<h3>Posted on ${dLong(st.day)} <small>${cur.a.length} posts</small></h3>
<div class="seg">${["All","Article","Reel"].map(t=>`<button class="${st.af===t?"on":""}" data-af="${t}">${t==="All"?"All":t+"s"}</button>`).join("")}</div>
<div class="list">${list.length?list.slice(0,st.n.act).map(p=>postRow(p)).join(""):'<div class="card"><div class="empty">No posts on this day</div></div>'}</div>${more("act",list.length)}`}
function users(){
if(st.user!==null){
const u=U[st.user],all=P.filter(p=>p.uid===u.id).sort((a,b)=>a.hrs-b.hrs);
const list=st.ut==="All"?all:all.filter(p=>p.type===st.ut);
return `<div class="card prof"><div class="av" style="background:${u.col}">${u.name.split(" ").map(w=>w[0]).join("")}</div><div class="grow"><div class="t">${u.name}</div><div class="m">${u.loc} · Joined ${u.joined}</div></div></div>
<div class="grid" style="margin-top:12px"><div class="card stat"><small>Total posts</small><b>${all.length}</b></div><div class="card stat"><small>Total likes</small><b>${fmt(all.reduce((s,p)=>s+p.likes,0))}</b></div></div>
<h3>Posted by ${u.name.split(" ")[0]} <small>latest first</small></h3>
<div class="seg">${["All","Article","Reel"].map(t=>`<button class="${st.ut===t?"on":""}" data-ut="${t}">${t==="All"?"All":t+"s"}</button>`).join("")}</div>
<div class="list">${list.length?list.slice(0,st.n.user).map(p=>postRow(p)).join(""):'<div class="empty">No posts yet</div>'}</div>${more("user",list.length)}`}
const f=U.filter(u=>(u.name+u.loc).toLowerCase().includes(st.q.toLowerCase()));
return `<input class="search" id="q" placeholder="Search users..." value="${st.q}">
<h3>All users <small>${f.length} found</small></h3>
<div class="list">${f.map(u=>{const c=P.filter(p=>p.uid===u.id).length;return `<button class="row" data-u="${u.id}"><div class="av" style="background:${u.col}">${u.name.split(" ").map(w=>w[0]).join("")}</div><div class="grow"><div class="t">${u.name}</div><div class="m">${u.loc}</div></div><div class="likes">${c} posts ›</div></button>`}).join("")||'<div class="empty">No users found</div>'}</div>`}
function trend(){
const l=P.filter(p=>p.type===st.tr).sort((a,b)=>b.likes-a.likes);
return `<div class="seg">${["Article","Reel"].map(t=>`<button class="${st.tr===t?"on":""}" data-tr="${t}">Trending ${t}s</button>`).join("")}</div>
<h3>Highest likes <small>${st.tr}s</small></h3>
<div class="list">${l.slice(0,st.n.tr).map((p,i)=>postRow(p,i+1)).join("")}</div>${more("tr",l.length)}`}
function del(){
return `<h3 style="margin-top:4px">Deleted posts <small>${D.length} total</small></h3>
<div class="list">${D.slice(0,st.n.del).map(d=>`<div class="row">${media({id:d.pid,type:d.type},false,true)}<div class="grow"><div class="t">${d.title}</div><div class="m"><span class="tag ${d.role==="Admin"?"r":d.role==="Moderator"?"":"g"}">${d.role}</span>Deleted by <b>${d.by}</b></div><div class="m">${d.type} by ${d.author} · ${d.reason} · ${ago(d.hrs)}</div></div></div>`).join("")}</div>${more("del",D.length)}`}
function render(){
hdr();nav();
$("main").innerHTML=st.tab==="dash"?dash():st.tab==="act"?act():st.tab==="users"?users():st.tab==="trend"?trend():del();
const m=$("main");
m.querySelectorAll(".more").forEach(b=>b.onclick=()=>{st.n[b.dataset.k]+=5;render()});
m.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{st.user=+b.dataset.u;st.ut="All";st.n.user=5;render();scrollTo(0,0)});
m.querySelectorAll("[data-ut]").forEach(b=>b.onclick=()=>{st.ut=b.dataset.ut;st.n.user=5;render()});
m.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{st.day=+b.dataset.d;st.n.act=5;render()});
m.querySelectorAll("[data-af]").forEach(b=>b.onclick=()=>{st.af=b.dataset.af;st.n.act=5;render()});
m.querySelectorAll("[data-tr]").forEach(b=>b.onclick=()=>{st.tr=b.dataset.tr;st.n.tr=5;render()});
const q=$("q");if(q)q.oninput=()=>{st.q=q.value;const p=q.selectionStart;render();const n=$("q");n.focus();n.setSelectionRange(p,p)};
}
render();
/* Pull preview images that already exist in index.html (same folder) */
(async function(){
try{
const r=await fetch("index.html",{cache:"no-store"});if(!r.ok)return;
const t=await r.text(),set=new Set(),base=location.href;
const ext="(?:jpe?g|png|webp|gif|avif)";
const re=new RegExp("(?:src|data-src|poster|content)\\s*=\\s*[\"']([^\"']+\\."+ext+"(?:\\?[^\"']*)?)[\"']|url\\([\"']?([^\"')]+\\."+ext+"(?:\\?[^\"')]*)?)[\"']?\\)|[\"'](https?:\\/\\/[^\"'\\s]+\\."+ext+"(?:\\?[^\"'\\s]*)?)[\"']|[\"'](https?:\\/\\/(?:images\\.unsplash\\.com|picsum\\.photos|i\\.ytimg\\.com|img\\.youtube\\.com)[^\"'\\s)]+)[\"']","gi");
let m;while((m=re.exec(t))){const u=m[1]||m[2]||m[3]||m[4];if(!u||/logo|icon|favicon|sprite|avatar|placeholder/i.test(u))continue;try{set.add(new URL(u,base).href)}catch(e){}}
if(set.size){IMG=[...set];render()}
}catch(e){}
})();
</script>
</body>
